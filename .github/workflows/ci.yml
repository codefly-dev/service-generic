name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Boundary/conformance check: the generic agent is a manifest- and
  # transport-neutral producer that emits no Kubernetes output. These checks
  # run without Git write access, network, kubeconfig, Argo, or cloud
  # credentials, and enforce that the source grows no repository or reconciler
  # integration.
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'go.mod'
          cache: false
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Boundary and conformance tests
        run: go test ./...

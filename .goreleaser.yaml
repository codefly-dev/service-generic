version: 2

project_name: service-generic

builds:
  # The generic agent installs no semantic analyzer, so it carries no
  # tree-sitter CGO dependency and cross-compiles as pure Go. Building with
  # CGO_ENABLED=0 removes the platform-compiler requirement that made packaging
  # slow and resource-heavy.
  - id: default
    binary: service-generic
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: linux
        goarch: arm64

archives:
  - id: default
    formats:
      - tar.gz
    # Must match Core's downloader: service-{name}_{version}_{os}_{arch}.tar.gz
    # (agents/manager/downloader_url.go); the binary inside is service-{name}.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
